services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: sprs-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_HOST
        value: your-aiven-mysql-host.aivencloud.com
      - key: DB_PORT
        value: 12345
      - key: DB_NAME
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        value: your-aiven-password
      - key: DB_USE_SSL
        value: "true"
      - key: DB_ALLOW_PUBLIC_KEY_RETRIEVAL
        value: "true"
      - key: APP_SEED_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: priyanselvaraj756@gmail.com
      - key: MAIL_PASSWORD
        value: your-gmail-app-password
      - key: MAIL_FROM
        value: priyanselvaraj756@gmail.com

  # 2. React Frontend Static Site
  - type: web
    name: sprs-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sprs-backend.onrender.com/api/v1
